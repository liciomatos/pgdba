version: '3.8'

# Logical replication pub/sub setup: publisher (port 5434) + subscriber (port 5435)
#
# Start:   docker compose up -d
# Connect to publisher: pgdba-cli --host=localhost --port=5434 --user=postgres --password=postgres --dbname=sales --sslmode=disable
# Connect to subscriber: pgdba-cli --host=localhost --port=5435 --user=postgres --password=postgres --dbname=sales --sslmode=disable
# MCP against publisher: pgdba-cli --mcp --url "postgres://postgres:postgres@localhost:5434/sales?sslmode=disable"
#
# The subscriber creates a subscription pointing to the publisher inside the Docker network.
# Allow ~5 seconds after startup for initial sync.

services:
  publisher:
    image: docker.io/library/postgres:16
    container_name: pgdba_publisher
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales
    ports:
      - "5434:5432"
    volumes:
      - publisher_data:/var/lib/postgresql/data
      - ./publisher-init.sh:/docker-entrypoint-initdb.d/01-init.sh
    command: >
      postgres
        -c wal_level=logical
        -c max_wal_senders=10
        -c max_replication_slots=10
        -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10

  subscriber:
    image: docker.io/library/postgres:16
    container_name: pgdba_subscriber
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales
    ports:
      - "5435:5432"
    volumes:
      - subscriber_data:/var/lib/postgresql/data
      - ./subscriber-init.sh:/docker-entrypoint-initdb.d/01-init.sh
    command: >
      postgres
        -c wal_level=logical
        -c shared_preload_libraries=pg_stat_statements
    depends_on:
      publisher:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  publisher_data:
  subscriber_data:
